name: Lint apps

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint app packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install lint dependencies
        run: npm install --no-audit --no-fund

      - name: Lint every app
        # --check-images verifies each pinned digest is publicly pullable and
        # publishes both linux/amd64 and linux/arm64.
        run: npm run lint:apps -- --all --check-images

      - name: Lint the linter
        run: npm run test:lint
