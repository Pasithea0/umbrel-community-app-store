name: Update Murmur

# Keeps the packaged Murmur (Pasithea) pinned to the newest commit on the `dev`
# branch of the fork it is built from, so this store does not need manual upkeep
# when that branch moves.
#
# Deliberately not triggered by push: the job commits to this repository, and a
# push trigger would make it re-run against its own commit. The image it pins is
# built by Pasithea0/murmur's own "Dev image" workflow, so a run that finds no
# image for the newest commit simply does nothing and tries again tomorrow.

on:
  schedule:
    # A daily check is enough; the offset avoids the top-of-hour rush on
    # GitHub's scheduler, and the other updaters' minutes.
    - cron: "33 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-murmur
  cancel-in-progress: false

jobs:
  update:
    name: Repin Murmur and commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install lint dependencies
        run: npm install --no-audit --no-fund

      - name: Install crane
        # The repin script resolves image digests and platform lists with crane,
        # falling back to `docker buildx imagetools` when it is absent.
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Repin to the newest fork commit
        env:
          # Only used to raise the GitHub API rate limit when resolving the
          # fork's head commit. The image digests come from the registries.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-murmur.sh

      - name: Lint the package before committing
        run: npm run lint:apps -- pasithea-murmur --check-images

      - name: Commit and push
        run: |
          set -euo pipefail
          # Scope the commit to the app package; the repin script only ever
          # writes those two files.
          if git diff --quiet -- pasithea-murmur; then
            echo "Nothing to commit - the package is already current."
            exit 0
          fi
          version="$(sed -nE 's/^version: *"?([^"]*)"? *$/\1/p' pasithea-murmur/umbrel-app.yml | head -1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pasithea-murmur
          git commit -m "chore(murmur): update package to ${version}"
          git push
